# ── Project ────────────────────────────────────────────────────────────────
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8 -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.caching=true
# Configuration cache stays off: a few AGP 8.5 task paths aren't fully
# cache-compatible yet and a bad cache invalidates whole CI runs.
org.gradle.configuration-cache=false

android.useAndroidX=true
# Keep R classes small & namespaced per-module.
android.nonTransitiveRClass=true

# ── R8 / shrinking ─────────────────────────────────────────────────────────
# R8 full mode: aggressive tree-shaking, class merging, access modification.
# This is the single biggest APK-size / method-count win we get.
android.enableR8.fullMode=true

# ── Kotlin / Compose ───────────────────────────────────────────────────────
kotlin.code.style=official
# Kotlin 2.0 = K2 compiler by default; strong skipping for the Compose
# compiler is enabled by default and is never toggled off in this project.

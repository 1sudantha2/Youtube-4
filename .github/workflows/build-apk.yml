name: Build APK

on:
  push:
    branches: ["**"]
  workflow_dispatch: {}

jobs:
  build:
    name: Build You-tube.apk
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Repo has no wrapper jar; the action installs Gradle directly.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build release APK (R8 full mode, CI-signed)
        run: gradle :app:assembleRelease --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: You-tube-apk
          path: app/build/outputs/apk/release/You-tube.apk
          if-no-files-found: error
          retention-days: 30

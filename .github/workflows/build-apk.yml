name: Build APK

on:
  push:
    branches: ["**"]
  workflow_dispatch: {}

jobs:
  build:
    name: Build You-tube.apk
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Repo has no wrapper jar; the action installs Gradle directly.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build release APK (R8 full mode, CI-signed)
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      # Writes the real error into the job summary so it's readable from
      # the check-run API without needing the full log stream.
      - name: Publish failure details
        if: failure()
        run: |
          {
            echo "## Gradle failure details"
            echo '```'
            grep -n -B3 -A30 -m1 "FAILURE: Build failed" build.log || tail -100 build.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "--- first errors ---"
          grep -m20 -E "^e: |error:|Execution failed" build.log || true

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: You-tube-apk
          path: app/build/outputs/apk/release/You-tube.apk
          if-no-files-found: error
          retention-days: 30

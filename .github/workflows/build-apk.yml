name: Build APK

on:
  push:
    branches: ["**"]
  workflow_dispatch: {}

jobs:
  build:
    name: Build You-tube.apk
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Repo has no wrapper jar; the action installs Gradle directly.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # Self-generated throwaway keystore so the APK installs on devices.
      - name: Create CI signing keystore
        run: |
          keytool -genkeypair \
            -keystore ci.keystore \
            -storepass android -keypass android \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build release APK (R8 full mode, CI-signed)
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      # Surfaces the real error as workflow annotations (readable via the
      # check-run annotations API) and keeps the full log as an artifact.
      - name: Publish failure details
        if: failure()
        run: |
          ERRS=$(grep -m30 -E "^e: |> Task .*FAILED|error:" build.log || true)
          DETAILS=$(grep -B2 -A12 -m1 "FAILURE: Build failed" build.log || true)
          [ -z "$DETAILS" ] && DETAILS=$(tail -40 build.log || true)
          [ -n "$ERRS" ] && DETAILS="$ERRS
          $DETAILS"
          echo "$DETAILS"
          DETAILS="${DETAILS//'%'/'%25'}"
          DETAILS="${DETAILS//$'\n'/'%0A'}"
          DETAILS="${DETAILS//$'\r'/'%0D'}"
          echo "::error title=Gradle build failed::$DETAILS"
          {
            echo "## Gradle failure details"
            echo '```'
            echo "$DETAILS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7

      - name: Upload APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: You-tube-apk
          path: app/build/outputs/apk/release/You-tube.apk
          if-no-files-found: error
          retention-days: 30

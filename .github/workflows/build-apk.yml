name: Build APK

on:
  push:
    branches: ["**"]
  workflow_dispatch: {}

permissions:
  contents: write

# Skip the loop created when this workflow itself pushes the APK branch.
jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, 'apk-bot')
    name: Build You-tube.apk
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Repo has no wrapper jar; the action installs Gradle directly.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # Self-generated throwaway keystore so the APK installs on devices.
      - name: Create CI signing keystore
        run: |
          keytool -genkeypair \
            -keystore ci.keystore \
            -storepass android -keypass android \
            -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build release APK (R8 full mode, CI-signed)
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      # Surfaces the real error as workflow annotations (readable via the
      # check-run annotations API) and keeps the full log as an artifact.
      - name: Publish failure details
        if: failure()
        run: |
          ERRS=$(grep -m30 -E "^e: |> Task .*FAILED|error:" build.log || true)
          DETAILS=$(grep -B2 -A12 -m1 "FAILURE: Build failed" build.log || true)
          [ -z "$DETAILS" ] && DETAILS=$(tail -40 build.log || true)
          [ -n "$ERRS" ] && DETAILS="$ERRS
          $DETAILS"
          echo "$DETAILS"
          DETAILS="${DETAILS//'%'/'%25'}"
          DETAILS="${DETAILS//$'\n'/'%0A'}"
          DETAILS="${DETAILS//$'\r'/'%0D'}"
          echo "::error title=Gradle build failed::$DETAILS"

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 7

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: You-tube-apk
          path: app/build/outputs/apk/release/You-tube.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: You-tube v1.0.0
          body: |
            CI-built release APK (R8 full mode, signed with a throwaway CI
            keystore — fine for sideloading/testing).
          files: app/build/outputs/apk/release/You-tube.apk
          make_latest: true

      # Pushes the APK to a dedicated branch so it can be fetched with
      # plain git (artifact storage hosts may be unreachable from some
      # networks). The apk-bot marker prevents a workflow re-run loop.
      - name: Commit APK to release-artifacts branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B release-artifacts
          mkdir -p dist
          cp app/build/outputs/apk/release/You-tube.apk dist/You-tube.apk
          git add -f dist/You-tube.apk
          git commit -m "chore: publish You-tube.apk (apk-bot)"
          git push -f origin release-artifacts
